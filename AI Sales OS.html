<script type="text/babel">
const { useState } = React;

const TWEAK_DEFAULTS = /*EDITMODE-BEGIN*/{
  "accentColor": "#00c46e",
  "sidebarCollapsed": false,
  "density": "default",
  "darkMode": true
}/*EDITMODE-END*/;

// Resolve oklch string for a hex color by matching presets
const ACCENT_PRESETS_MAP = {
  '#00c46e': '0.71 0.195 160',
  '#3b82f6': '0.60 0.180 250',
  '#8b5cf6': '0.58 0.200 290',
  '#ec4899': '0.60 0.210 340',
  '#f97316': '0.72 0.200 55',
  '#06b6d4': '0.72 0.145 210',
};
function applyAccentColor(hex) {
  const oklch = ACCENT_PRESETS_MAP[hex];
  if (oklch) {
    document.documentElement.style.setProperty('--p', `oklch(${oklch})`);
    const hov = oklch.replace(/^([\d.]+)/, v => (parseFloat(v)+0.05).toFixed(2));
    document.documentElement.style.setProperty('--p-hover', `oklch(${hov})`);
    document.documentElement.style.setProperty('--p-dim', `oklch(${oklch} / 0.12)`);
    document.documentElement.style.setProperty('--p-border', `oklch(${oklch} / 0.38)`);
  } else {
    document.documentElement.style.setProperty('--p', hex);
  }
}

function App() {
  const [activeScreen, setActiveScreen] = useState('dashboard');
  const [tweaks, setTweak] = window.useTweaks(TWEAK_DEFAULTS);
  const [showOnboarding, setShowOnboarding] = useState(() => {
    return localStorage.getItem('ai_sales_os_onboarded') !== 'true';
  });
  const TweaksPanel = window.TweaksPanel;

  function completeOnboarding() {
    localStorage.setItem('ai_sales_os_onboarded', 'true');
    setShowOnboarding(false);
  }

  // Apply accent color using oklch mapping
  React.useEffect(() => {
    applyAccentColor(tweaks.accentColor);
  }, [tweaks.accentColor]);

  // Apply density
  React.useEffect(() => {
    const dense = tweaks.density === 'compact';
    document.documentElement.style.setProperty('--topbar-h', dense ? '44px' : '52px');
    document.documentElement.style.setProperty('--sidebar-w', dense ? '200px' : '224px');
  }, [tweaks.density]);

  // Apply dark/light theme
  React.useEffect(() => {
    const dark = tweaks.darkMode !== false;
    document.documentElement.setAttribute('data-theme', dark ? 'dark' : 'light');
  }, [tweaks.darkMode]);

  return (
    <>
      <window.AppShell
        activeScreen={activeScreen}
        setActiveScreen={setActiveScreen}
        tweaks={tweaks}
        setTweak={setTweak}
      />

      {showOnboarding && (
        <window.Onboarding onComplete={completeOnboarding} />
      )}

      <TweaksPanel title="Tweaks — AI Sales OS">
        <window.TweakSection label="Visual">
          <window.TweakColor
            label="Cor de destaque"
            value={tweaks.accentColor}
            onChange={v => setTweak('accentColor', v)}
          />
          <window.TweakToggle
            label="Modo escuro"
            value={tweaks.darkMode !== false}
            onChange={v => setTweak('darkMode', v)}
          />
          <window.TweakRadio
            label="Densidade"
            value={tweaks.density}
            options={[
              { value: 'compact', label: 'Compacta' },
              { value: 'default', label: 'Padrão' },
            ]}
            onChange={v => setTweak('density', v)}
          />
        </window.TweakSection>
        <window.TweakSection label="Navegação">
          <window.TweakToggle
            label="Sidebar recolhida"
            value={tweaks.sidebarCollapsed}
            onChange={v => setTweak('sidebarCollapsed', v)}
          />
        </window.TweakSection>
        <window.TweakSection label="Telas">
          <window.TweakButton label="→ Painel"              onClick={() => setActiveScreen('dashboard')} />
          <window.TweakButton label="→ Caixa de Entrada"    onClick={() => setActiveScreen('inbox')} />
          <window.TweakButton label="→ Pipeline"            onClick={() => setActiveScreen('pipeline')} />
          <window.TweakButton label="→ Configurações"       onClick={() => setActiveScreen('settings')} />
          <window.TweakButton label="→ Agentes"             onClick={() => setActiveScreen('agents')} />
          <window.TweakButton label="→ Relatórios"          onClick={() => setActiveScreen('reports')} />
        </window.TweakSection>
        <window.TweakSection label="Onboarding">
          <window.TweakButton label="↺ Reiniciar tour" onClick={() => { localStorage.removeItem('ai_sales_os_onboarded'); setShowOnboarding(true); }} />
        </window.TweakSection>
      </TweaksPanel>
    </>
  );
}

const root = ReactDOM.createRoot(document.getElementById('root'));
root.render(<App />);
</script>
